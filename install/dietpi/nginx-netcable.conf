# NetCable frontend for DietPi. Installed to /etc/nginx/sites-available/netcable
# and enabled by install.sh. Serves the prebuilt Vite bundle and proxies
# /api/ to the backend (systemd service on 127.0.0.1:8000).
# Port 3080 avoids clashes with Pi-hole (8089/8489) and live-dns (8090).
server {
    listen 3080;
    server_name _;

    root /home/dietpi/netcable/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
